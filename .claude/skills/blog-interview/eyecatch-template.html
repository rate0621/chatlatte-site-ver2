<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Noto+Sans+JP:wght@500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden; position: relative;
    background: #F6F1E8; font-family: "Zen Maru Gothic", sans-serif;
    box-sizing: border-box; padding: 56px 64px;
    display: flex; flex-direction: column;
  }
  .ring {
    position: absolute; right: -150px; bottom: -190px;
    width: 500px; height: 500px; border-radius: 50%;
    border: 70px solid rgba(179, 122, 76, 0.12); pointer-events: none;
  }
  .top { display: flex; justify-content: space-between; align-items: center; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand svg { width: 46px; height: 46px; }
  .brand span { font-weight: 700; font-size: 28px; color: #33261C; }
  .cat {
    background: #B37A4C; color: #FFFDF9; font-weight: 700; font-size: 22px;
    padding: 8px 26px; border-radius: 999px;
  }
  .main { flex: 1; display: flex; flex-direction: column; justify-content: center; position: relative; }
  .title {
    font-weight: 700; color: #33261C; line-height: 1.5;
    letter-spacing: 0.01em; max-height: 380px; overflow: hidden;
  }
  .subtitle {
    font-weight: 700; color: #8A7461; line-height: 1.5; margin-top: 18px;
  }
  .bottom { display: flex; justify-content: space-between; align-items: center; }
  .url { font-family: "Noto Sans JP", sans-serif; font-size: 22px; color: #8A7461; }
  .bar { width: 120px; height: 10px; border-radius: 5px; background: #B37A4C; }

  .title .accent { color: #B37A4C; }
  .subtitle .accent { color: #B37A4C; }

  /* ダークバリエーション */
  body.dark { background: #33261C; }
  body.dark .title .accent { color: #E0A96D; }
  body.dark .subtitle .accent { color: #E0A96D; }
  body.dark .ring { border-color: rgba(179, 122, 76, 0.22); }
  body.dark .brand span { color: #F6F1E8; }
  body.dark .title { color: #F6F1E8; }
  body.dark .subtitle { color: #C9B7A4; }
  body.dark .url { color: #C9B7A4; }
</style>
</head>
<body>
  <div class="ring"></div>
  <div class="top">
    <div class="brand">
      <svg viewBox="0 0 128 128">
        <path d="M34 93 Q28 112 18 124 Q42 118 54 104 Z" fill="#B37A4C"/>
        <circle cx="64" cy="58" r="46" fill="#B37A4C"/>
        <circle cx="64" cy="58" r="36" fill="none" stroke="#F6F1E8" stroke-opacity="0.45" stroke-width="4"/>
        <circle cx="46" cy="58" r="7.5" fill="#FFFDF9"/>
        <circle cx="64" cy="58" r="7.5" fill="#FFFDF9"/>
        <circle cx="82" cy="58" r="7.5" fill="#FFFDF9"/>
      </svg>
      <span>chatlatte</span>
    </div>
    <div class="cat" id="cat">ビジネス</div>
  </div>
  <div class="main">
    <div class="title" id="title"></div>
    <div class="subtitle" id="subtitle" hidden></div>
  </div>
  <div class="bottom">
    <div class="url">www.chatlatte.com</div>
    <div class="bar"></div>
  </div>
  <script type="module">
    // BudouX：日本語を文節単位で改行させる（「垂れ流し／に」のような不自然な折り返しを防ぐ）
    import { loadDefaultJapaneseParser } from "https://cdn.jsdelivr.net/npm/budoux@0.6.2/module/index.js";
    const parser = loadDefaultJapaneseParser();

    // 「**強調**」マーカーを解釈しつつ、文節単位のスパンを組み立てる。
    // 改行してよい場所（セグメント境界）と、色を塗る場所（アクセント）は別の基準なので分けて扱う：
    //   - セグメント境界：「」の中は丸ごと1つにして改行させない。それ以外はBudouXの文節境界で区切る
    //   - アクセント色：**マーカーの文字位置と厳密に一致する範囲だけを塗る（セグメントをまたいでよい）
    // これを1つの基準で済まそうとすると、「」直後の「を」「に」まで着色されるなどのズレが起きる。
    const setPhrased = (el, rawText) => {
      el.textContent = "";

      // **マーカーを取り除いた素のテキストと、強調範囲（素のテキスト内の文字位置）を求める
      let plain = "";
      const accentRanges = [];
      const markerRe = /\*\*(.+?)\*\*/g;
      let lastIndex = 0;
      let match;
      while ((match = markerRe.exec(rawText)) !== null) {
        plain += rawText.slice(lastIndex, match.index);
        const start = plain.length;
        plain += match[1];
        accentRanges.push([start, plain.length]);
        lastIndex = markerRe.lastIndex;
      }
      plain += rawText.slice(lastIndex);
      const isAccentChar = (i) => accentRanges.some(([s, e]) => i >= s && i < e);

      // 「」で囲まれた範囲は1つの意味の塊なので、内部では改行させない
      const bracketRanges = [];
      const bracketRe = /「[^」]*」/g;
      let bracketMatch;
      while ((bracketMatch = bracketRe.exec(plain)) !== null) {
        bracketRanges.push([bracketMatch.index, bracketMatch.index + bracketMatch[0].length]);
      }
      const bracketAtChar = (i) => bracketRanges.findIndex(([s, e]) => i >= s && i < e);

      // BudouXの文節境界（「」の外側で改行してよい位置）を求める
      const phraseStarts = new Set();
      let cursor = 0;
      for (const phrase of parser.parse(plain)) {
        phraseStarts.add(cursor);
        cursor += phrase.length;
      }

      // 改行の最小単位（セグメント）に分割する：「」の中は丸ごと1つ、外側は文節ごと
      const segments = [];
      let i = 0;
      while (i < plain.length) {
        const br = bracketAtChar(i);
        let j = i + 1;
        if (br !== -1) {
          while (j < plain.length && bracketAtChar(j) === br) j++;
        } else {
          while (j < plain.length && bracketAtChar(j) === -1 && !phraseStarts.has(j)) j++;
        }
        segments.push([i, j]);
        i = j;
      }

      // 各セグメントをinline-block（＝改行しない1単位）にしつつ、
      // 内部はアクセントの有無で正確に色分けした子スパンに分ける
      for (const [segStart, segEnd] of segments) {
        const wrapper = document.createElement("span");
        wrapper.style.display = "inline-block";

        let runStart = segStart;
        let runAccent = isAccentChar(segStart);
        for (let k = segStart + 1; k <= segEnd; k++) {
          const charAccent = k < segEnd ? isAccentChar(k) : !runAccent; // 末尾で必ず1回フラッシュする
          if (charAccent !== runAccent) {
            const child = document.createElement("span");
            child.textContent = plain.slice(runStart, k);
            if (runAccent) child.classList.add("accent");
            wrapper.appendChild(child);
            runStart = k;
            runAccent = charAccent;
          }
        }
        el.appendChild(wrapper);
      }
    };

    const params = new URLSearchParams(location.search);
    const rawTitle = params.get("title") || "記事タイトル";
    const cat = params.get("cat");
    if (cat) document.getElementById("cat").textContent = cat;
    if (params.get("theme") === "dark") document.body.classList.add("dark");

    // 「——」（EMダッシュ）または「――」（水平バー）があればサブタイトルとして分離する
    const titleEl = document.getElementById("title");
    const subtitleEl = document.getElementById("subtitle");
    const parts = rawTitle.split(/(?:——|――)/);
    setPhrased(titleEl, parts[0]);
    if (parts.length > 1) {
      setPhrased(subtitleEl, parts.slice(1).join("——"));
      subtitleEl.hidden = false;
    }

    // タイトル長に応じてフォントサイズを自動調整（はみ出したら縮小）
    let size = 68;
    const fit = () => {
      titleEl.style.fontSize = size + "px";
      subtitleEl.style.fontSize = Math.round(size * 0.5) + "px";
      const main = document.querySelector(".main");
      return main.scrollHeight <= main.clientHeight + 1;
    };
    while (!fit() && size > 40) size -= 2;
  </script>
</body>
</html>
